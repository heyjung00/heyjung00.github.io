<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PIXEL SUDOKU | 레트로 스도쿠</title><style>
:root{font-family:'Courier New',monospace;color:#f9e8b5;background:#202d35}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 12px;background:repeating-linear-gradient(0deg,transparent 0 5px,#ffffff05 5px 6px),linear-gradient(135deg,#243943,#17252d)}.app{max-width:620px;margin:auto}header{text-align:center;margin:0 0 20px}h1{font-size:clamp(34px,8vw,58px);letter-spacing:5px;margin:0;color:#ffcf6e;text-shadow:4px 4px 0 #a64c41,8px 8px 0 #101e25;font-weight:900}header p{font-size:12px;letter-spacing:3px;color:#8bd7bd;margin:12px 0 0}.panel{background:#f2dfaa;color:#263943;border:5px solid #111e26;box-shadow:8px 8px 0 #d4754e,13px 13px 0 #101c24;padding:22px}.toolbar,.stats,.actions,.digits{display:flex;gap:9px;justify-content:space-between;align-items:center;flex-wrap:wrap}.toolbar{margin-bottom:16px}.toolbar label{font-weight:900;letter-spacing:1px}select,button{font:inherit;border:3px solid #263943;border-radius:0;padding:10px 12px;cursor:pointer;box-shadow:3px 3px 0 #263943;transition:transform .08s,box-shadow .08s}button{background:#f7b75e;color:#273840;font-weight:900}button:hover{background:#ffd27c}button:active{transform:translate(3px,3px);box-shadow:0 0 0 #263943}button.primary{background:#e87956;color:#1f2f36}select{background:#fff3ce;color:#263943;font-weight:900}.stats{background:#273c43;color:#fff0c5;border:3px solid #17262b;padding:12px 10px;margin:14px 0;font-size:13px;gap:8px}.stats strong{color:#80e0b4;font-size:16px}.board{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));border:4px solid #263943;aspect-ratio:1;background:#263943;gap:1px;touch-action:manipulation;box-shadow:4px 4px 0 #b77a54}.cell{border:0;border-radius:0;box-shadow:none;padding:0;background:#fff8dd;color:#bd5b42;font-size:clamp(17px,4.6vw,27px);font-weight:900;min-width:0;display:flex;align-items:center;justify-content:center}.cell:hover{background:#f8e5a8}.cell.fixed{background:#e6d7ae;color:#273b43}.cell.peer{background:#d8ead5}.cell.same{background:#a9dec5}.cell.selected{background:#f5ba63!important;outline:3px solid #b65040;outline-offset:-3px}.cell.wrong{color:#b72e39;background:#ffd0c5!important}.cell:nth-child(3n):not(:nth-child(9n)){border-right:3px solid #263943}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:3px solid #263943}.digits{margin:20px 0 17px;gap:5px;flex-wrap:nowrap}.digits button{flex:1;min-width:0;font-size:clamp(15px,4vw,23px);padding:12px 0;background:#8bcdb3}.digits button:hover{background:#b8ebd0}.actions{justify-content:center}.actions button{flex:1;min-width:0;font-size:13px;background:#f9c879}.message{text-align:center;min-height:24px;color:#9b4a37;margin:18px 0 0;font-size:13px;font-weight:900;line-height:1.5}.footer{text-align:center;font-size:12px;color:#d9c995;margin:22px 0;line-height:1.7}.arcade-tag{display:inline-block;background:#8cd8b5;color:#1b3037;padding:5px 12px;border:3px solid #15252c;box-shadow:4px 4px 0 #ad5c46;font-size:11px;font-weight:900;letter-spacing:2px;margin-bottom:13px}@media(max-width:480px){body{padding:17px 9px}.panel{padding:12px;border-width:4px;box-shadow:5px 5px 0 #d4754e,9px 9px 0 #101c24}.toolbar{gap:10px}.toolbar label{font-size:12px}.toolbar button{font-size:12px}.stats{font-size:11px;padding:9px 6px}.stats strong{font-size:13px}.digits button{padding:10px 0;border-width:2px;box-shadow:2px 2px 0 #263943}.actions{gap:5px}.actions button{padding:10px 3px;font-size:11px;border-width:2px;box-shadow:2px 2px 0 #263943}.cell:nth-child(3n):not(:nth-child(9n)){border-right-width:2px}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom-width:2px}}

/* 8-BIT ARCADE OVERHAUL */
@font-face{font-family:PixelLocal;src:local('Press Start 2P'),local('DungGeunMo'),local('Galmuri11');font-display:swap}
:root{font-family:PixelLocal,'Courier New',monospace;background:#11152b;color:#fff0a6}
body{background-color:#11152b;background-image:linear-gradient(#ffffff07 1px,transparent 1px),linear-gradient(90deg,#ffffff07 1px,transparent 1px),radial-gradient(circle at 18% 12%,#3d396a 0,transparent 34%),radial-gradient(circle at 85% 78%,#163d4a 0,transparent 40%);background-size:24px 24px,24px 24px,auto,auto;image-rendering:pixelated}
.app{max-width:650px;position:relative}
header{position:relative;padding:15px 0 20px}
header:before,header:after{content:'✦  +  ✦';position:absolute;color:#6cf7d2;font:900 20px monospace;top:7px;left:0;text-shadow:3px 3px #174a52}
header:after{left:auto;right:0;color:#ff8b7d}
h1{font-family:PixelLocal,'Courier New',monospace;font-size:clamp(27px,6.6vw,48px);letter-spacing:0;line-height:1.35;color:#ffe37e;text-shadow:3px 0 #f17c76,-3px 0 #f17c76,0 3px #f17c76,0 -3px #f17c76,6px 6px 0 #171b35,9px 9px 0 #6b4b75}
header p{font-size:clamp(9px,2vw,12px);color:#73f3cb;letter-spacing:1px}
.arcade-tag{background:#ff8b78;color:#24233c;border:4px solid #15172e;box-shadow:0 4px 0 #15172e,4px 0 0 #15172e,4px 8px 0 #6a3854;letter-spacing:1px}
.panel{background:#f7e9b7;border:6px solid #11152b;outline:4px solid #70e8bf;box-shadow:10px 10px 0 #ee8c75,16px 16px 0 #11152b;padding:22px}
.toolbar label{font-size:13px}.toolbar{gap:12px}
button,select{border:3px solid #17243a;border-radius:0;box-shadow:inset -3px -3px 0 #00000022,4px 4px 0 #17243a;transition:none;font-family:PixelLocal,'Courier New',monospace;font-weight:900;letter-spacing:-.5px}
button:hover{filter:brightness(1.08)}button:focus-visible,select:focus-visible{outline:3px dashed #f16f77;outline-offset:4px}
button:active{transform:translate(4px,4px);box-shadow:inset 2px 2px 0 #00000033}
button.primary{background:#ff8d77}.stats{background:#182c42;border:4px solid #0d192b;box-shadow:inset 0 0 0 3px #365569;gap:9px;font-size:12px}.stats strong{color:#6df7cb}
.board{border:6px solid #16253d;background:#17263c;gap:2px;box-shadow:6px 6px 0 #ef9875,10px 10px 0 #18243b}
.cell{font-family:PixelLocal,'Courier New',monospace;background:#fff6d6;color:#d45664;font-size:clamp(17px,4.3vw,26px);text-shadow:1px 1px 0 #e9a9a1;image-rendering:pixelated;box-shadow:none;outline:none}
.cell.fixed{background:#e9d9aa;color:#253b50;text-shadow:2px 2px 0 #c9bc96}
.cell.peer{background:#d7eed5}.cell.same{background:#91e2c0}.cell.selected{background:#ffe07c!important;outline:4px dashed #e76b6a;outline-offset:-5px;box-shadow:inset 0 0 0 3px #fff4c2}.cell.wrong{background:#ffb2b1!important;color:#9b243c}
.cell:nth-child(3n):not(:nth-child(9n)){border-right:4px solid #17263c}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:4px solid #17263c}
.digits{margin-top:23px;gap:5px}.digits button{background:#70e3bc;padding:13px 0;font-size:clamp(15px,3.8vw,22px);box-shadow:3px 4px 0 #17243a}.digits button:nth-child(3n){background:#ffca77}.digits button:hover{background:#b7f4dc}.digits button.completed,.digits button.completed:hover{background:#858c98!important;color:#d3d5da!important;border-color:#505765;box-shadow:2px 2px 0 #505765;opacity:.65;cursor:not-allowed;text-shadow:none;filter:grayscale(1)}.digits button.completed:disabled{transform:none}
.actions button{background:#ffc76e;font-size:clamp(10px,2.1vw,13px)}.actions button:nth-child(2){background:#83dfcb}.actions button:nth-child(3){background:#ff9a83}
.message{color:#ab4053;min-height:32px}.footer{color:#b6b9d8}
@media(max-width:480px){body{padding:16px 10px 28px}.panel{padding:11px;border-width:4px;outline-width:3px;box-shadow:6px 6px 0 #ee8c75,10px 10px 0 #11152b}header:before,header:after{font-size:12px;top:0}.board{border-width:4px;gap:1px}.cell:nth-child(3n):not(:nth-child(9n)){border-right-width:3px}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom-width:3px}.cell.selected{outline-width:3px;outline-offset:-4px}.digits button{padding:11px 0;font-size:16px;border-width:2px}.toolbar label{font-size:11px}.toolbar button,.toolbar select{font-size:11px;padding:9px 7px}.stats{font-size:10px;padding:9px 5px}.actions button{font-size:10px;padding:10px 2px}.arcade-tag{font-size:9px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
.toolbar #sound{background:#75e4c4;color:#17243a;font-size:11px;padding:9px 7px}.toolbar #sound[aria-pressed="false"]{background:#c1bbac;color:#484655}@media(max-width:480px){.toolbar{flex-wrap:wrap}.toolbar #sound{font-size:9px}}</style></head><body><main class="app"><header><span class="arcade-tag">★ 8-BIT ARCADE ★</span><h1>PIXEL SUDOKU</h1><p>LEVEL UP YOUR BRAIN · 1 PLAYER</p></header><section class="panel"><div class="toolbar"><label>난이도 <select id="level"><option value="easy">쉬움</option><option value="medium" selected>보통</option><option value="hard">어려움</option></select></label><button id="sound" type="button" aria-pressed="true" title="효과음 켜기/끄기">♪ SOUND ON</button><button class="primary" id="new">↻ 새 게임</button></div><div class="stats"><span>⏱ <strong id="time">00:00</strong></span><span>실수 <strong id="mistakes">0</strong></span><span>힌트 <strong id="hints">3</strong>회</span></div><div id="board" class="board" role="grid" aria-label="스도쿠 게임판"></div><div class="digits" id="digits"></div><div class="actions"><button id="erase">⌫ 지우기</button><button id="hint">💡 힌트</button><button id="check">✓ 정답 확인</button></div><p class="message" id="message" aria-live="polite"></p></section><p class="footer">빈 칸을 선택하고 숫자를 입력하세요 · 키보드 1–9 지원</p></main><script>
const $=id=>document.getElementById(id);let solution=[],puzzle=[],board=[],selected=-1,mistakes=0,hints=3,seconds=0,timer=null,finished=false;

// Web Audio synthesizer: all effects are generated locally; no audio files needed.
let audioContext=null,soundOn=true;
function beep(freq=440,duration=.08,wave='square',volume=.07,endFreq=null,delay=0){
 if(!soundOn)return;
 try{
  audioContext=audioContext||new (window.AudioContext||window.webkitAudioContext)();
  if(audioContext.state==='suspended')audioContext.resume();
  const now=audioContext.currentTime+delay,osc=audioContext.createOscillator(),gain=audioContext.createGain();
  osc.type=wave;osc.frequency.setValueAtTime(freq,now);
  if(endFreq)osc.frequency.exponentialRampToValueAtTime(Math.max(1,endFreq),now+duration);
  gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(volume,now+.008);
  gain.gain.exponentialRampToValueAtTime(.0001,now+duration);
  osc.connect(gain);gain.connect(audioContext.destination);osc.start(now);osc.stop(now+duration+.015);
 }catch(e){}
}
function sfx(type){
 if(type==='select')beep(520,.035,'square',.025,620);
 if(type==='input')beep(680,.075,'square',.055,880);
 if(type==='erase')beep(360,.09,'triangle',.07,180);
 if(type==='wrong'){beep(210,.14,'sawtooth',.06,125);beep(155,.15,'square',.035,90,.13)}
 if(type==='hint'){[620,830,1040].forEach((f,i)=>beep(f,.11,'square',.045,null,i*.09))}
 if(type==='check'){beep(460,.07,'square',.04);beep(700,.11,'square',.04,null,.08)}
 if(type==='start'){beep(392,.09,'square',.035);beep(523,.09,'square',.035,null,.1);beep(784,.14,'square',.04,null,.2)}
 if(type==='win'){[523,659,784,1047,784,1047].forEach((f,i)=>beep(f,i===5?.34:.12,'square',.05,null,i*.13))}
}
$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'♪ SOUND ON':'♪ SOUND OFF';$('sound').setAttribute('aria-pressed',String(soundOn));if(soundOn)sfx('select')};
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function valid(b,i,n){let r=Math.floor(i/9),c=i%9;for(let k=0;k<9;k++){if(b[r*9+k]===n||b[k*9+c]===n)return false;let rr=3*Math.floor(r/3)+Math.floor(k/3),cc=3*Math.floor(c/3)+k%3;if(b[rr*9+cc]===n)return false}return true}
function solve(b,random=false){let best=-1,opts=null;for(let i=0;i<81;i++)if(!b[i]){let a=[];for(let n=1;n<=9;n++)if(valid(b,i,n))a.push(n);if(!a.length)return false;if(!opts||a.length<opts.length){best=i;opts=a;if(a.length===1)break}}if(best<0)return true;if(random)shuffle(opts);for(const n of opts){b[best]=n;if(solve(b,random))return true;b[best]=0}return false}
function countSolutions(b,limit=2){let best=-1,opts=null;for(let i=0;i<81;i++)if(!b[i]){let a=[];for(let n=1;n<=9;n++)if(valid(b,i,n))a.push(n);if(!a.length)return 0;if(!opts||a.length<opts.length){best=i;opts=a;if(a.length===1)break}}if(best<0)return 1;let count=0;for(const n of opts){b[best]=n;count+=countSolutions(b,limit-count);b[best]=0;if(count>=limit)break}return count}
function createPuzzle(){let full=Array(81).fill(0);solve(full,true);solution=full;puzzle=full.slice();let target={easy:38,medium:47,hard:53}[$('level').value];let removed=0;for(const i of shuffle([...Array(81).keys()])){if(removed>=target)break;let old=puzzle[i];puzzle[i]=0;if(countSolutions(puzzle.slice())!==1)puzzle[i]=old;else removed++}board=puzzle.slice()}
function updateDigits(){for(const b of $('digits').children){const n=Number(b.dataset.number);const count=board.reduce((sum,v,i)=>sum+(v===n&&solution[i]===n?1:0),0);const done=count===9;b.disabled=done;b.classList.toggle('completed',done);b.setAttribute('aria-label',done?`${n} 완료`:String(n));b.title=done?`${n} 숫자 9개 완료`:`${n} 숫자 ${count}/9`;}}
function draw(){const root=$('board');root.innerHTML='';board.forEach((n,i)=>{let b=document.createElement('button');b.className='cell';b.textContent=n||'';b.setAttribute('role','gridcell');b.setAttribute('aria-label',`${Math.floor(i/9)+1}행 ${i%9+1}열 ${n||'빈 칸'}`);if(puzzle[i])b.classList.add('fixed');if(selected>=0){let r=Math.floor(i/9),c=i%9,sr=Math.floor(selected/9),sc=selected%9;if(r===sr||c===sc||(Math.floor(r/3)===Math.floor(sr/3)&&Math.floor(c/3)===Math.floor(sc/3)))b.classList.add('peer');if(n&&n===board[selected])b.classList.add('same');if(i===selected)b.classList.add('selected')}if(n&&n!==solution[i]&&!puzzle[i])b.classList.add('wrong');b.onclick=()=>{selected=i;sfx('select');draw()};root.appendChild(b)});$('mistakes').textContent=mistakes;$('hints').textContent=hints;updateDigits()}
function message(s){$('message').textContent=s}
function put(n){if(finished||selected<0||puzzle[selected])return;board[selected]=n;if(n&&n!==solution[selected]){sfx('wrong');mistakes++;message('이 숫자는 정답과 다릅니다. 다시 도전해 보세요.')}else {sfx(n?'input':'erase');message('')}draw();complete()}
function complete(){if(board.every((v,i)=>v===solution[i])){finished=true;clearInterval(timer);sfx('win');message('🎉 축하합니다! 스도쿠를 완성했어요!')}}
function start(){sfx('start');clearInterval(timer);selected=-1;mistakes=0;hints=3;seconds=0;finished=false;$('time').textContent='00:00';message('퍼즐을 풀어보세요!');createPuzzle();draw();timer=setInterval(()=>{if(!finished){seconds++;$('time').textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`}},1000)}
for(let n=1;n<=9;n++){let b=document.createElement('button');b.textContent=n;b.dataset.number=n;b.onclick=()=>put(n);$('digits').appendChild(b)}$('erase').onclick=()=>put(0);$('new').onclick=start;$('level').onchange=start;$('hint').onclick=()=>{if(finished)return;if(hints<=0){sfx('wrong');message('힌트를 모두 사용했어요.');return}let candidates=board.map((v,i)=>v!==solution[i]?i:-1).filter(i=>i>=0);if(!candidates.length)return;let i=selected>=0&&board[selected]!==solution[selected]?selected:candidates[Math.floor(Math.random()*candidates.length)];board[i]=solution[i];selected=i;hints--;sfx('hint');draw();message('💡 선택한 칸에 정답을 채웠어요.');complete()};$('check').onclick=()=>{sfx('check');let wrong=board.filter((v,i)=>v&&v!==solution[i]).length,empty=board.filter(v=>!v).length;message(wrong?`틀린 칸 ${wrong}개가 있어요.`:empty?`현재까지 모두 맞아요! 남은 빈 칸 ${empty}개`:'모든 칸이 맞습니다!');complete()};document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(/^[1-9]$/.test(e.key))put(Number(e.key));else if(e.key==='Backspace'||e.key==='Delete'||e.key==='0')put(0);else if(selected>=0&&e.key.startsWith('Arrow')){e.preventDefault();let r=Math.floor(selected/9),c=selected%9;if(e.key==='ArrowUp')r=Math.max(0,r-1);if(e.key==='ArrowDown')r=Math.min(8,r+1);if(e.key==='ArrowLeft')c=Math.max(0,c-1);if(e.key==='ArrowRight')c=Math.min(8,c+1);selected=r*9+c;sfx('select');draw()}});soundOn=false;start();soundOn=true;
</script></body></html>
